# Publica la carpeta site/ en GitHub Pages.
# El sitio no está en la raíz del repo, por eso se sube sólo esa carpeta.
name: Publicar el sitio

on:
  push:
    branches: [feat/site-go180]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar las páginas internas
        run: cd site && python3 paginas.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
